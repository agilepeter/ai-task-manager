[package]
name = "ai-task-manager"
version = "0.1.2"
description = "AI subscription usage, limits and local AI inventory in the tray"
authors = ["Peter Saddington", "jazii (upstream Pane)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_task_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aitm-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
tokio = { version = "1", features = ["macros", "sync", "time"] }
chrono = "0.4"
base64 = "0.22"

[dev-dependencies]
aitm-core = { path = "../crates/core", features = ["test-support"] }

# Windows-only: WebView2 memory hints.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
