# Windows is the platform the dev machine cannot build, so CI covers it.
# macOS is the daily driver: it is built and tested locally on every change (a
# Tauri build is about ten minutes), and release.yml already builds a macOS
# bundle for tagged releases. Add a macOS job here only if Mac stops being
# the daily driver.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which half changed decides which job runs: a UI-only push must not pay for
  # a fifteen-minute Windows Rust build, and a Rust-only push needs no tsc.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare against what the branch pointed at BEFORE this push, not
          # HEAD~1: a push of several commits must not hide a Rust change
          # behind a final UI-only commit. No usable base means run it all.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "$changed"
          rust=false; web=false
          echo "$changed" | grep -qE '^(crates/|src-tauri/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)' && rust=true
          echo "$changed" | grep -qE '^(src/|scripts/|index\.html$|package(-lock)?\.json$|tsconfig\.json$|vite\.config\.ts$|\.github/workflows/ci\.yml$)' && web=true
          echo "rust=$rust" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      # These 12 tests existed for weeks with no runner: not in package.json,
      # not here. They passed the whole time, which is exactly why nobody
      # noticed they were never being asked.
      - name: Frontend tests
        run: npm test

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds the built frontend at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Core builds without Tauri
        run: cargo check -p aitm-core
      - name: Tests
        run: cargo test --workspace --locked
