# Builds installers for a version tag and attaches them, with the updater
# artifacts (.sig files and latest.json), to a DRAFT release, then checks
# that draft against its own update-feed JSON and the changelog before
# publishing it. NOT run on ordinary pushes. A manual run (workflow_dispatch,
# no tag) builds without creating a release, and its draft (there isn't one)
# can never reach the publish job either; that is how to rehearse. The
# repository is public, so these runners cost nothing.
#
# What it can and cannot do today is in SHIPPING.md. In short: signing and
# notarization switch on by adding the secrets listed there; no step here
# needs editing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The bundler treats an EMPTY Apple variable as a set one and tries to
      # import a certificate that is not there, so the Apple variables must be
      # absent, not blank, until the owner adds the secrets. GitHub cannot omit
      # an env key conditionally; a flag step picks one of two otherwise
      # identical build steps instead.
      - id: signing
        shell: bash
        env:
          HAVE_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: echo "apple=$HAVE_APPLE" >> "$GITHUB_OUTPUT"

      # Without Apple secrets: an ad-hoc signature ("-"), the same thing a
      # local `tauri build` produces. Gatekeeper still needs right-click > Open.
      - uses: tauri-apps/tauri-action@v0
        if: steps.signing.outputs.apple != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "AI Task Manager ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # With Apple secrets: Developer ID signing and notarization, no edits needed.
      - uses: tauri-apps/tauri-action@v0
        if: steps.signing.outputs.apple == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "AI Task Manager ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Only a real tag push reaches here: a workflow_dispatch rehearsal has no
  # tag ref, so the condition below never lets it through, and the draft
  # from a rehearsal (there isn't one) can never be auto-published either.
  # This job reads the draft back the way an installer will -- its exact
  # asset names, its own update-feed JSON, the changelog entry a person
  # will read -- and only then flips it to published. Every check lives in
  # the script so it can also be run by hand against an existing draft.
  publish:
    needs: [build]
    # A job-level if: replaces GitHub's implicit success() gate rather than adding to it,
    # so success() must be spelled out here or a failed build leg (fail-fast is off) would
    # still let this job run.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the draft and publish it
        run: scripts/verify-and-publish-release.sh "${{ github.ref_name }}"
