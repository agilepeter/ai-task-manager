<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Menu bar glyph and in-app mark. Black on transparent: macOS tints a
       template image for light and dark menu bars, so it carries shape only,
       never colour.

       Drawn as ONE solid head with the face knocked out (fill-rule evenodd)
       rather than as outlines. At 16px a stroked face turns to mush and the
       earlier arch-shaped eyes read as the letter "m"; a solid silhouette with
       holes keeps the most contrast where there are fewest pixels. -->
  <g fill="#000">
    <rect x="20.8" y="4" width="2.4" height="6" rx="1.2"/>
    <circle cx="22" cy="4" r="2.8"/>
    <path fill-rule="evenodd" d="M12 10h20a7 7 0 0 1 7 7v15a7 7 0 0 1-7 7H12a7 7 0 0 1-7-7V17a7 7 0 0 1 7-7Z
      M16.2 19.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z
      M27.8 19.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z
      M15.4 29.4a1.6 1.6 0 0 0-1.1 2.8c2 1.9 4.7 2.9 7.7 2.9s5.7-1 7.7-2.9a1.6 1.6 0 0 0-1.1-2.8 1.6 1.6 0 0 0-1.1.45c-1.4 1.35-3.4 2.1-5.5 2.1s-4.1-.75-5.5-2.1a1.6 1.6 0 0 0-1.1-.45Z"/>
  </g>
</svg>
