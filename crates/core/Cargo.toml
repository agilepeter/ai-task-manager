[package]
name = "aitm-core"
version = "0.1.0"
description = "AI Task Manager core: providers, spend, pricing, inventory, alerts and the local API. No UI, no Tauri."
edition = "2021"
license = "MIT"
publish = false

[features]
# Exposes helpers that are otherwise test-only, for the app crate's own tests.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
chrono = "0.4"
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
toml = "0.8"
regex = "1"
prost = "0.13" # Grok GetRemainingResets protobuf codec
md-5 = "0.11.0"

# Windows-only: Credential Manager, ACL hardening, display language, reading
# an agent host's own working folder through its PEB.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
