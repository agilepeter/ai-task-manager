[package]
name = "aitm-agent"
version = "0.1.0"
description = "AI Task Manager headless agent: prints or pushes this machine's seat report. No UI."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aitm-core = { path = "../core" }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
